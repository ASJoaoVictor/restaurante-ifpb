version: '3'

services:
  traefik:
    container_name: meals-traefik
    image: traefik:v3.6
    env_file: .env
    restart: always
    tty: true
    ports:
      - '${HTTP_PORT:-80}:80'
      - '${HTTPS_PORT:-443}:443'
      # - '8080:8080' # Dashboard
    volumes:
      - '/var/run/docker.sock:/var/run/docker.sock:ro'
      - './letsencrypt:/letsencrypt'
      - './logs:/logs'
    command:
      - '--providers.docker=true' # Habilita o provedor Docker
      - '--providers.docker.exposedbydefault=false' # Não expõe os containers que não têm a label traefik.enable=true

      # Entrypoints
      - '--entrypoints.web.address=:${HTTP_PORT:-80}' # HTTP
      - '--entrypoints.websecure.address=:${HTTPS_PORT:-443}' # HTTPS
      - '--entrypoints.websecure.http3=true' # Habilita QUIC/HTTP3

      # Redireciona HTTP para HTTPS
      - '--entryPoints.web.http.redirections.entryPoint.to=websecure'
      - '--entryPoints.web.http.redirections.entryPoint.scheme=https'
      - '--entryPoints.web.http.redirections.entryPoint.permanent=true'

      # Let's Encrypt
      - '--certificatesresolvers.letsencrypt.acme.httpchallenge=true'
      - '--certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web'
      - '--certificatesresolvers.letsencrypt.acme.email=${LETSENCRYPT_EMAIL:?}'
      - '--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json'

      # Logs
      - '--log.level=INFO'
      - '--log.filepath=/logs/traefik.log'
      - '--accesslog=true' # Logs HTTP
      - '--accesslog.filepath=/logs/traefik-http.log'
      - '--accesslog.format=json'

      # Healthcheck
      - '--ping=true'

      # Dashboard (descomentar para ativar)
      # - '--api.insecure=true'
    healthcheck:
      test: ["CMD-SHELL", "traefik healthcheck --ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    container_name: meals-backend
    build: ./backend
    env_file: .env
    restart: always
    tty: true
    depends_on:
      - database
    volumes:
      - ./backend/logs:/app/logs
      - ./backend/public/uploads:/app/public/uploads
    environment:
      NODE_ENV: production
      PORT: 80
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:-root}@meals-database:5432/meals
      TZ: America/Fortaleza
      JWT_SECRET: ${JWT_SECRET:?}
      APP_URL: https://${DOMAIN:?}
      BACKEND_APP_URL: https://${DOMAIN:?}
    labels:
      - 'traefik.enable=true'
      - 'traefik.http.services.backend.loadbalancer.server.port=80'

      # Routers
      - 'traefik.http.routers.backend.rule=PathPrefix(`/api`)'
      - 'traefik.http.routers.backend.entrypoints=websecure'
      - 'traefik.http.routers.backend.tls.certresolver=letsencrypt'
      - 'traefik.http.routers.backend.tls.domains[0].main=${DOMAIN:?}'
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:80/api/internal/health-check']
      interval: 10s
      timeout: 5s
      retries: 10

  frontend:
    container_name: meals-frontend
    build:
      context: ./frontend
      args:
        - VITE_API_ENDPOINT=
        - VITE_REPORT_EMAIL=${VITE_REPORT_EMAIL:-}
        - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
    env_file: .env
    restart: always
    tty: true
    environment:
      TZ: America/Fortaleza
    labels:
      - 'traefik.enable=true'
      - 'traefik.http.services.frontend.loadbalancer.server.port=80'

      # Routers
      - 'traefik.http.routers.frontend.rule=PathPrefix(`/`) && !PathPrefix(`/api`)'
      - 'traefik.http.routers.frontend.entrypoints=websecure'
      - 'traefik.http.routers.frontend.tls.certresolver=letsencrypt'
      - 'traefik.http.routers.frontend.tls.domains[0].main=${DOMAIN:?}'
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:80']
      interval: 10s
      timeout: 5s
      retries: 10

  database:
    container_name: meals-database
    image: postgres:17-alpine
    env_file: .env
    restart: always
    tty: true
    volumes:
      - ./database:/var/lib/postgresql/data
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: meals
      TZ: America/Fortaleza
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d meals']
      interval: 10s
      timeout: 5s
      retries: 10

  backup:
    container_name: meals-backup
    build: ./backup
    env_file: .env
    restart: always
    tty: true
    stop_grace_period: 1s
    depends_on:
      - database
    volumes:
      - ./backup/backups:/backups
      - ./logs:/logs
      - ./backend/public/uploads:/uploads
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:-root}@meals-database:5432/meals
      TZ: America/Fortaleza
