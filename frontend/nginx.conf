server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/plain text/css application/javascript application/json;

  location / {
    # Cache
    add_header Cache-Control "no-cache";

    # Helmet
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; connect-src 'self' https://accounts.google.com; font-src 'self' https: data:; form-action 'self'; frame-src 'self' https://accounts.google.com; frame-ancestors 'self'; img-src 'self' data: https://lh3.googleusercontent.com; object-src 'none'; script-src 'self' 'unsafe-eval' https://accounts.google.com; script-src-attr 'none'; style-src 'self' https: 'unsafe-inline'; upgrade-insecure-requests" always;
    add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Origin-Agent-Cluster "?1" always;
    add_header Permissions-Policy "geolocation=(), microphone=()" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-DNS-Prefetch-Control "off" always;
    add_header X-Download-Options "noopen" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Permitted-Cross-Domain-Policies "none" always;
    add_header X-XSS-Protection "0" always;

    try_files $uri $uri/ /index.html;
  }

  location /assets {
    # Cache
    expires 1y;
    add_header Cache-Control "public, immutable";

    # Helmet
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; connect-src 'self' https://accounts.google.com; font-src 'self' https: data:; form-action 'self'; frame-src 'self' https://accounts.google.com; frame-ancestors 'self'; img-src 'self' data: https://lh3.googleusercontent.com; object-src 'none'; script-src 'self' 'unsafe-eval' https://accounts.google.com; script-src-attr 'none'; style-src 'self' https: 'unsafe-inline'; upgrade-insecure-requests" always;
    add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Origin-Agent-Cluster "?1" always;
    add_header Permissions-Policy "geolocation=(), microphone=()" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-DNS-Prefetch-Control "off" always;
    add_header X-Download-Options "noopen" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Permitted-Cross-Domain-Policies "none" always;
    add_header X-XSS-Protection "0" always;

    try_files $uri $uri/ /index.html;
  }

  error_page 404 /index.html;
}
